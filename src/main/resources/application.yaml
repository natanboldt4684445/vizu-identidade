spring:
  application:
    name: identidade
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vizu_identidade}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    schemas: identidade
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8082

app:
  jwt:
    issuer: ${JWT_ISSUER:vizu-identidade}
    secret: ${JWT_SECRET:dev-only-change-this-secret-to-at-least-32-bytes}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

vizu:
  messaging:
    exchange: ${RABBITMQ_EXCHANGE:vizu.events}
    outbox-interval-ms: ${OUTBOX_INTERVAL_MS:5000}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka'
  instance:
    hostname: localhost
